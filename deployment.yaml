
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-week12-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-week12
  template:
    metadata:
      labels:
        app: devops-week12
    spec:
      containers:
        - name: devops-week12
          image: suhithasv/devops-week12:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
