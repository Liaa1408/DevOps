<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 50px;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            min-height: 100vh;
        }

        .box {
            width: 350px;
            margin: auto;
            padding: 30px;
            background-color: white;
            border: 3px solid #6c63ff;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        h2 {
            color: #6c2bd9;
            margin-bottom: 25px;
        }

        label {
            color: #333;
            font-weight: bold;
        }

        input {
            width: 250px;
            padding: 10px;
            margin: 8px 0 15px;
            border: 2px solid #9face6;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #6c63ff;
        }

        button {
            padding: 10px 25px;
            background-color: #6c63ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #4b43c6;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Student Registration Form</h2>

    <form method="POST">

        <label>Name</label><br>
        <input type="text" name="name" required><br>

        <label>Student ID</label><br>
        <input type="text" name="student_id" required><br>

        <label>Email</label><br>
        <input type="email" name="email" required><br>

        <button type="submit">Register</button>

    </form>

</div>

</body>
</html>
